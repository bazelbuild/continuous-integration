steps:
  - command: |-
      bazel --ignore_all_rc_files version
      ./src/upload_all_java_tools.sh
    label: ":ubuntu:"
    agents:
      - "queue=default"
    plugins:
      docker#v3.8.0:
        always-pull: true
        environment:
          - ANDROID_HOME
          - ANDROID_NDK_HOME
          - BUILDKITE_ARTIFACT_UPLOAD_DESTINATION
        image: gcr.io/bazel-public/rockylinux8-releaser@sha256:3f71441ba319525db2e484b1403905970cb486261ab79fcac02ab221b099be98
        network: host
        privileged: true
        propagate-environment: true
        propagate-uid-gid: true
        shell: ["/bin/bash", "-e", "-c"]
        volumes:
          - "/etc/group:/etc/group:ro"
          - "/etc/passwd:/etc/passwd:ro"
          - "/etc/shadow:/etc/shadow:ro"
          - "/opt/android-ndk-r15c:/opt/android-ndk-r15c:ro"
          - "/opt/android-sdk-linux:/opt/android-sdk-linux:ro"
          - "/var/lib/buildkite-agent:/var/lib/buildkite-agent"
          - "/var/lib/gitmirrors:/var/lib/gitmirrors:ro"

  - command: |-
      bazel --ignore_all_rc_files version
      ./src/upload_all_java_tools.sh
    label: "Rocky Linux 8 (arm64)"
    agents:
      - "queue=arm64"
    plugins:
      docker#v3.8.0:
        always-pull: true
        environment:
          - ANDROID_HOME
          - ANDROID_NDK_HOME
          - BUILDKITE_ARTIFACT_UPLOAD_DESTINATION
        image: gcr.io/bazel-public/rockylinux8-releaser@sha256:5b9fb256f457bc7638900a1abb6b8b2a5e4407c9f16b7b26600900fd286a12e6
        network: host
        privileged: true
        propagate-environment: true
        propagate-uid-gid: true
        shell: ["/bin/bash", "-e", "-c"]
        volumes:
          - "/etc/group:/etc/group:ro"
          - "/etc/passwd:/etc/passwd:ro"
          - "/etc/shadow:/etc/shadow:ro"
          - "/opt/android-ndk-r15c:/opt/android-ndk-r15c:ro"
          - "/opt/android-sdk-linux:/opt/android-sdk-linux:ro"
          - "/var/lib/buildkite-agent:/var/lib/buildkite-agent"
          - "/var/lib/gitmirrors:/var/lib/gitmirrors:ro"

  - command: "powershell -Command \"bazel --ignore_all_rc_files version ; if (\\$LastExitCode -ne 0) { exit 1 } ; sh ./src/upload_all_java_tools.sh ; if (\\$LastExitCode -ne 0) { exit 1 } ;\""
    label: ":windows:"
    agents:
      - "queue=windows"

  - command: |-
      bazel --ignore_all_rc_files version
      ./src/upload_all_java_tools.sh
    label: ":darwin:"
    agents:
      - "queue=macos"
    env:
      ANDROID_HOME: ""
      ANDROID_NDK_HOME: ""

  - command: |-
      bazel --ignore_all_rc_files version
      ./src/upload_all_java_tools.sh
    label: ":darwin_arm64:"
    agents:
      - "queue=macos_arm64"
