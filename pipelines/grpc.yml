---
bazel: "8.x"

matrix:
  linux_platform:
    - ubuntu2204
    - ubuntu2404

tasks:
  linux:
    platform: ${{ linux_platform }}
    environment: &env
      BAZELISK_SKIP_WRAPPER: "true"
    build_flags:
      - "--build_tag_filters=-no_linux"
      - "--cxxopt=-Wno-invalid-partial-specialization"
      - "--host_cxxopt=-Wno-invalid-partial-specialization"
    test_flags:
      - "--test_tag_filters=-no_linux"
      - "--cxxopt=-Wno-invalid-partial-specialization"
      - "--host_cxxopt=-Wno-invalid-partial-specialization"
    build_targets: &build_targets
      - "//:all"
      - "//examples/cpp/..."
      - "//examples/protos/..."
    test_targets: &test_targets
      - "//test/core/config:all"
      - "//test/core/util:all"
      - "//test/cpp/common:all"
  macos_arm64:
    environment: *env
    build_flags:
      - "--build_tag_filters=-no_mac"
    test_flags:
      - "--test_tag_filters=-no_mac"
    build_targets: *build_targets
    test_targets: *test_targets
  windows:
    environment: *env
    build_flags:
      - "--define=protobuf_allow_msvc=true"
      - "--build_tag_filters=-no_windows,-grpc-fuzztest"
    test_flags:
      - "--define=protobuf_allow_msvc=true"
      - "--test_tag_filters=-no_windows,-grpc-fuzztest"
    build_targets: *build_targets
    test_targets: *test_targets
