name: "Terraform: Nightly Deployment"

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 2 AM UTC
  workflow_dispatch:

# go/github-security: Explicitly set minimum permissions
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  terraform-nightly:
    runs-on: ubuntu-latest
    concurrency:
      # Must match the group used by terraform.yml.
      group: "Terraform: CI Pipelines Infrastructure-${{ matrix.org }}-${{ github.ref }}"
      cancel-in-progress: false

    # Use environment for secret isolation
    environment: ${{ matrix.org }}
    strategy:
      fail-fast: false
      matrix:
        org: ["bazel", "bazel-trusted"]

    defaults:
      run:
        working-directory: ./buildkite/terraform/${{ matrix.org }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_wrapper: false
        terraform_version: "1.9.5"
    
    - name: Terraform Init
      run: terraform init

    - name: Terraform Apply
      env:
        TF_VAR_buildkite_api_token: ${{ secrets.BUILDKITE_API_TOKEN }}
      run: terraform apply -auto-approve -input=false

    - name: Report failure
      if: failure()
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        ORG: ${{ matrix.org }}
      with:
        script: |
          const org = process.env.ORG;
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const title = `Nightly Terraform deployment failed for \`${org}\``;
          const body = `Nightly Terraform deployment failed for organization \`${org}\`.\n\ncc @bazelbuild/bazel-oss\n\nRun: ${runUrl}`;

          let existingNumber = null;
          try {
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Nightly Terraform deployment failed for \`${org}\`"`;
            const { data: { items } } = await github.rest.search.issuesAndPullRequests({ q: query });
            if (items.length > 0) {
              existingNumber = items[0].number;
            }
          } catch (e) {
            console.log('Error searching issues:', e);
          }

          if (existingNumber) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingNumber,
              body: `Nightly deployment failed again.\n\nSee run logs: ${runUrl}`,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
            });
          }
